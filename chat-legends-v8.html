<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>أساطير الشات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--r:#aab8d0;--r2:#eef2f8;--g:#4d5a73;--gold:#f6f9fe;--m:#8c97aa;--b:rgba(255,255,255,.09)}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,system-ui,sans-serif;color:#fff;padding:24px 12px;min-height:100vh;background:radial-gradient(900px 520px at 85% -8%,#1f2c4d,transparent 62%),radial-gradient(700px 500px at 0 105%,#141c36,transparent 62%),#070914}
.lg{max-width:1120px;margin:auto;position:relative;background:linear-gradient(180deg,#10132a,#090b18);border:1px solid var(--b);border-radius:30px;padding:30px;overflow:hidden;box-shadow:0 30px 90px #000a,0 0 90px rgba(140,165,220,.1)}
.lg:before{content:"";position:absolute;inset:0 0 auto;height:2px;background:linear-gradient(90deg,transparent,var(--r),transparent)}
.lg:after{display:none;content:"";position:absolute;width:520px;height:520px;right:-180px;top:-260px;background:radial-gradient(closest-side,rgba(150,175,230,.18),transparent);pointer-events:none}
.hd{display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:1;margin:-30px -30px 0;padding:30px;border-bottom:1px solid rgba(120,160,230,.12);background:linear-gradient(180deg,#0e1326,#0a0d1c)}
.star{position:relative;width:64px;height:64px;border-radius:20px;background:linear-gradient(160deg,#10172e,#070a16);display:grid;place-items:center;font-size:30px;color:#8cb8ff;border:1px solid rgba(110,150,235,.45);box-shadow:0 0 30px rgba(90,135,230,.35),inset 0 1px 0 rgba(255,255,255,.12);text-shadow:0 0 14px rgba(130,175,255,.8)}.star:after{content:'';position:absolute;left:-6px;bottom:-6px;width:20px;height:20px;border-radius:50%;background:#7fb0ff;border:3.5px solid #0a0e1e;box-shadow:0 0 12px rgba(120,170,255,.6)}
h2{font-size:32px;font-weight:900;line-height:1.15;color:#fff}
.sub{color:#4a78c4;font-size:13px;font-weight:700;margin-top:3px}
.pill{margin-inline-start:auto;display:flex;gap:8px}.pill span{border:1px solid rgba(170,180,200,.22);background:rgba(20,26,46,.7);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:800;color:#aab4c3}.pill .mn{color:#7fb0ff;border-color:rgba(100,150,240,.45);background:rgba(20,40,90,.45)}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;flex:none;overflow:hidden;background:linear-gradient(145deg,hsl(var(--h) 70% 50%),hsl(var(--h) 70% 22%));border:2px solid #ffffff2e;box-shadow:0 4px 12px #0007}.av img{width:100%;height:100%;object-fit:cover}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:14px;direction:ltr;margin:34px 0 12px;position:relative;z-index:1}
.pi{width:158px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.pi b{font-size:15px}
.pi .av{width:66px;height:66px;font-size:24px}
.p1 .av{width:90px;height:90px;font-size:34px;border:3px solid var(--gold);box-shadow:0 0 0 5px rgba(230,238,252,.15),0 0 42px rgba(220,230,250,.5)}
.p2 .av{border:3px solid #aab4c3;box-shadow:0 0 22px rgba(170,180,195,.35)}.p3 .av{border:3px solid #6b788e;box-shadow:0 0 22px rgba(107,120,142,.35)}
.crown{font-size:30px;filter:grayscale(1) brightness(1.7) contrast(1.1);margin-bottom:-8px;animation:fl 2.5s ease-in-out infinite;}
.pi small{color:var(--m);font-size:11px}.pi em{font-style:normal;color:var(--r2);font-weight:900;font-size:16px}
.base{width:100%;border-radius:16px 16px 0 0;display:grid;place-items:center;font-size:36px;font-weight:900;font-style:italic;color:#ffffff30;border:1px solid var(--b);border-bottom:0;background:linear-gradient(#232a42,#0a0c18);position:relative;overflow:hidden}
.base:before{content:"";position:absolute;inset:0 0 auto;height:2px}
.p1 .base{height:104px;background:linear-gradient(#46506c,#0a0c18);box-shadow:0 -12px 44px rgba(170,190,240,.28);border-color:rgba(190,205,235,.45);color:#ffffff55}.p1 .base:before{background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.p2 .base{height:74px}.p2 .base:before{background:linear-gradient(90deg,transparent,#aab4c3,transparent)}
.p3 .base{height:54px}.p3 .base:before{background:linear-gradient(90deg,transparent,#6b788e,transparent)}
.list{max-height:580px;overflow:auto;margin-top:18px;display:grid;gap:9px;padding:2px 4px 2px 8px;scrollbar-width:thin;scrollbar-color:#596475 transparent;position:relative;z-index:1}
.row{display:grid;grid-template-columns:36px 44px 1fr auto;align-items:center;gap:8px 12px;padding:11px 16px;border-radius:18px;background:linear-gradient(160deg,#141830,#0c0f1f);border:1px solid var(--b);transition:.25s;animation:up .5s both;animation-delay:calc(var(--i)*30ms)}
.row:hover{transform:translateX(-4px);border-color:rgba(190,205,235,.5);background:linear-gradient(160deg,#1b2140,#0f1328);box-shadow:0 8px 28px rgba(150,175,230,.2)}
.rk{font-weight:900;font-style:italic;color:#ffffff45;font-size:18px}
.nm b{display:block;font-size:14px}.nm small{color:var(--m);font-size:11px}
.st{display:flex;gap:6px}.st span{font-size:12px;font-weight:800;padding:4px 11px;border-radius:99px;background:#181d34;color:#aab8d0;border:1px solid rgba(170,190,230,.16)}.st .h{color:#f1f5fb;background:#252d4a;border-color:rgba(190,205,235,.3)}
.bar{grid-column:1/-1;height:4px;border-radius:9px;background:#1a1e34;overflow:hidden}.bar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,#4d5a73,#f1f5fb);border-radius:9px;box-shadow:0 0 10px rgba(190,210,250,.45)}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes fl{50%{transform:translateY(-5px)}}
@media(max-width:820px){.lg{padding:18px}}
@media(max-width:560px){.pod{gap:8px}.pi{width:106px}.p1 .av{width:72px;height:72px}.pi .av{width:54px;height:54px}h2{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<section class="lg">
<div class="hd"><div class="star">★</div><div><h2>أساطير الشات</h2><div class="sub">الأعلى مشاهدة في جميع البثوث</div></div><div class="pill"><span id="cnt"></span><span class="mn" id="mn"></span></div></div>
<div class="pod" id="pod"></div><div class="list" id="ls"></div>
</section>
<script>
const $=i=>document.getElementById(i);
/* استبدل D ببيانات الـ API: [{n:اسم, x:نقاط, l:لفل, h:ساعات, img:رابط الصورة}] */
const base=[["jonej",31200,16,61.5],["ovxfx",24300,12,52.4],["1Woozi",26800,14,47.2],["Noor_w",20100,14,40.1],["DOOIY",28300,16,36.8],["08Lama",18000,13,33.5],["DDAL",15000,12,30.2],["lena81l",21100,14,27.9],["ijnoo1",10600,10,25.4]];
const D=base.map(([n,x,l,h])=>({n,x,l,h}));let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647;
const P=["Zed","Nova","Rakan","Sama","Fahd","Lina","Omar","Reem","Taj","Dana","Khalid","Yara","Saif","Mody"];
for(let i=0;i<41;i++){const h=24-i*.55-rnd()*.4,x=Math.round(h*(380+rnd()*300));D.push({n:P[i%P.length]+(10+Math.floor(rnd()*89)),x,l:Math.max(1,Math.round(x/1750)),h})}
D.sort((a,b)=>b.h-a.h||b.x-a.x);
const K=v=>v>=1e3?(v/1e3).toFixed(1)+"K":v;
const av=p=>`<div class="av" style="--h:${[...p.n].reduce((a,ch)=>a+ch.charCodeAt(0),0)*37%360}">${p.img?`<img src="${p.img}">`:p.n[0].toUpperCase()}</div>`;
$("cnt").textContent=D.length+" أسطورة";$("mn").textContent=Math.round(D.reduce((a,p)=>a+p.h*60,0)).toLocaleString("en")+" دقيقة";
$("pod").innerHTML=[1,0,2].map(i=>{const p=D[i];return `<div class="pi p${i+1}">${i?"":'<div class="crown">👑</div>'}${av(p)}<b>${p.n}</b><small>Lv.${p.l} · ${K(p.x)} XP</small><em>${Math.round(p.h)}h</em><div class="base">${i+1}</div></div>`}).join("");
$("ls").innerHTML=D.slice(3).map((p,i)=>`<div class="row" style="--i:${i};--w:${(p.h/D[0].h*100).toFixed(1)}%"><span class="rk">${String(i+4).padStart(2,"0")}</span>${av(p)}<div class="nm"><b>${p.n}</b><small>Lv.${p.l}</small></div><div class="st"><span class="h">${Math.round(p.h)}h</span><span>${K(p.x)} XP</span></div><div class="bar"><i></i></div></div>`).join("");
</script>
</body></html>
